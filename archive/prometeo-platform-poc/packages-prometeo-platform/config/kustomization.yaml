# Wave -10: configuration for the packages in wave -20.
#
#   32  activates the Workspace resource (SafeStart: provider CRDs ship inactive)
#   33  what the provider pod may do inside the cluster
#   42  the root-module plumbing every Workspace inherits — providers, aliases, state backend
#
# This cluster's facts -- account, region, VPC, domains -- are NOT here. They are the one
# file that differs per rung, so they live in ../environments/<rung>/environment.yaml and are
# pulled in by that rung's kustomization. This directory is identical in every environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-wave: "-10"

resources:
  - 32-activate-workspaces.yaml
  - 33-rbac-terraform.yaml
  - 42-terraform-provider-config.yaml
