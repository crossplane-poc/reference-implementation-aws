apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: product
  title: "Bootstrap a product"
  description: >-
    Step 1 for a new product. Creates the product's namespace, its Product component (DNS, the
    developer role, the SSO WebACL, optionally an Airflow client) and its Backstage System entity.
    Run this once, then add services, databases and buckets to it.
  tags:
    - prometeo
spec:
  owner: guests
  type: system
  parameters:
    - title: About the product
      required:
        - name
      properties:
        name:
          title: Product name
          type: string
          description: >-
            e.g. "add". Becomes the namespace every component of this product lives in, and the
            Product AWS tag everything is grouped by for cost reporting.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Shown on the System entity in the catalog.
    - title: What it comes with
      properties:
        developerRole:
          title: Developer role
          type: boolean
          default: true
          description: An IAM role product developers assume, granted each component's policies.
        developerBedrock:
          title: Bedrock for the developer role
          type: boolean
          default: false
        airflowEnabled:
          title: Airflow client
          type: boolean
          default: false
          description: An ETLs bucket and grants on the airflow-<product> role.
        airflowRepos:
          title: Airflow GitHub repositories
          type: array
          items:
            type: string
          default: []
          description: Repositories allowed to deploy DAGs, e.g. ["iag-mro-add-data"].

  steps:
    - id: write-namespace
      name: Write the product namespace
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.name }}/base/namespace.yaml
        content: |
          # One namespace for the whole product, not one per service. The pods and their own
          # namespaces are created by Terraform inside the workspaces, so this namespace holds
          # control-plane objects only: the product's XRs, their Workspaces, and the ConfigMaps
          # they publish to each other.
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.name }}
            labels:
              name: ${{ parameters.name }}
              product: ${{ parameters.name }}
              platform: prometeo

    - id: write-component
      name: Write the Product manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.name }}/base/product.yaml
        content: |
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: Product
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.name }}
          spec:
            product: ${{ parameters.name }}
            modules:
              # Pinned by the platform, not by whoever fills in the form. No released tag accepts
              # the sb3 environment yet: every tag up to v6.5.1 fails the plan with "environment
              # must be one of: sb1, sb2, dev, tst, uat, prd".
              version: ital-1901-add-sb3-environment
            developerRole:
              enabled: ${{ parameters.developerRole }}
              bedrock: ${{ parameters.developerBedrock }}
          {% if parameters.airflowEnabled %}
            airflow:
              enabled: true
          {% if parameters.airflowRepos and parameters.airflowRepos | length %}
              githubRepos:
          {% for r in parameters.airflowRepos %}
                - ${{ r | dump }}
          {% endfor %}
          {% endif %}
          {% endif %}
            # The SSO login gate. Its Cognito client id is read from SSM during the apply,
            # through the environment's cross-account reader role, so there is nothing to set
            # and nothing to ask for. An environment that cannot do that read sets
            # spec.sso.clientId by hand.
            sso: {}

    - id: write-catalog-info
      name: Write the Backstage System entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.name }}/catalog-info.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: System
          metadata:
            name: ${{ parameters.name }}
            description: ${{ (parameters.description | default('Prometeo product ' + parameters.name)) | dump }}
            annotations:
              backstage.io/kubernetes-label-selector: 'product=${{ parameters.name }},platform=prometeo'
              backstage.io/kubernetes-namespace: ${{ parameters.name }}
          spec:
            owner: guests
            lifecycle: experimental
            type: service

    - id: publish
      name: Open a PR with the new product
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/product-${{ parameters.name }}
        title: 'prometeo product: ${{ parameters.name }}'
        description: >-
          Adds `products/${{ parameters.name }}/` — the namespace, the Product component and the
          Backstage System entity. Merging opens the directory to ArgoCD; syncing it provisions
          the product's DNS, developer role and SSO WebACL through
          tf-common-modules/bootstrap-product.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
