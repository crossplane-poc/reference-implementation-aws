apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: product
  title: "Bootstrap a product"
  description: >-
    Step 1 for a new product built from Prometeo's native Crossplane components. Creates the
    product's Backstage System entity in crossplane-poc/prometeo-products. Run this once per
    product, before adding any service, database, statefulbackend or s3 component to it.
  tags:
    - prometeo
spec:
  owner: guests
  type: service
  parameters:
    - title: Product
      required:
        - name
      properties:
        name:
          title: Product name
          type: string
          description: Short lowercase name, e.g. "add". Used as the product tag and the folder name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Shown on the product's Backstage System entity.

  steps:
    - id: write-catalog-info
      name: Write the product's System entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ values.name }}/catalog-info.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: System
          metadata:
            name: ${{ values.name }}
            description: ${{ (values.description | default('Prometeo product ' + values.name)) | dump }}
            annotations:
              backstage.io/kubernetes-label-selector: 'product=${{ values.name }},platform=prometeo'
          spec:
            owner: guests
            lifecycle: experimental
            type: service

    - id: publish
      name: Open a PR with the new product
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/product-${{ values.name }}
        title: 'prometeo product: bootstrap ${{ values.name }}'
        description: >-
          Adds `products/${{ values.name }}/catalog-info.yaml` (System entity) via the "product"
          Backstage template. Add its service/database/statefulbackend/s3 components next — each
          lands in `products/${{ values.name }}/base/` and gets picked up automatically, no file
          list to maintain.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
