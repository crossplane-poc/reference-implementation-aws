apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: product
  title: "Bootstrap a product"
  description: >-
    Step 1 for any new product in prometeo-products. Creates only the Backstage System entity
    (catalog-info.yaml) — no AWS, Crossplane, or Terraform. Run once per product before adding
    components via Crossplane templates (base/) or S3 (Terraform PR) (terraform/).
  tags:
    - prometeo
spec:
  owner: guests
  type: service
  parameters:
    - title: Product
      required:
        - name
      properties:
        name:
          title: Product name
          type: string
          description: Short lowercase name, e.g. "add". Used as the product tag and the folder name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Shown on the product's Backstage System entity.

  steps:
    - id: write-catalog-info
      name: Write the product's System entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.name }}/catalog-info.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: System
          metadata:
            name: ${{ parameters.name }}
            description: ${{ (parameters.description | default('Prometeo product ' + parameters.name)) | dump }}
            annotations:
              backstage.io/kubernetes-label-selector: 'product=${{ parameters.name }},platform=prometeo'
          spec:
            owner: guests
            lifecycle: experimental
            type: service

    - id: publish
      name: Open a PR with the new product
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/product-${{ parameters.name }}
        title: 'prometeo product: bootstrap ${{ parameters.name }}'
        description: >-
          Adds `products/${{ parameters.name }}/catalog-info.yaml` (System entity) via the "product"
          Backstage template. No infrastructure is provisioned. Add components next with Crossplane
          templates (→ `base/`) or S3 (Terraform PR) (→ `terraform/`).

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
