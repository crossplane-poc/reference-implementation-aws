apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service
  title: "Service"
  description: >-
    A service in a product: its namespace, IAM roles, a deploy role for its repository, network
    policies, and — for a frontend — a public address behind the shared ALB with SSO in front of
    it. Run the "product" template first.
  tags:
    - prometeo
spec:
  owner: guests
  type: service
  parameters:
    - title: About the service
      required:
        - name
        - product
        - repo
      properties:
        name:
          title: Service name
          type: string
          description: e.g. "add-be". Becomes the name of the service and of the namespace its pods run in.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this service belongs to.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        repo:
          title: GitHub repository
          type: string
          description: >-
            The service's own repository, e.g. "iag-mro-add-be". It gets a deploy role, so this is
            what lets the repository's pipeline push images and roll the deployment out.
        frontend:
          title: Is this a frontend?
          type: boolean
          default: false
          description: >-
            A frontend gets a public address on the shared ALB, with the SSO login gate in front
            of it. Everything else is reachable only from inside the cluster.
        containerPort:
          title: Container port
          type: integer
          default: 8000
          description: The port the application listens on. Backends usually 8000, frontends 3000.
    - title: What it connects to
      properties:
        needsDatabase:
          title: Does it use a database?
          type: boolean
          default: false
        needsBuckets:
          title: Does it use any S3 buckets?
          type: boolean
          default: false
      # Each picker only appears once its checkbox is ticked. One dependencies map holds both:
      # a JSON Schema object can carry exactly one, and each key inside it is independent.
      dependencies:
        needsDatabase:
          oneOf:
            - properties:
                needsDatabase:
                  enum: [false]
            - properties:
                needsDatabase:
                  enum: [true]
                database:
                  title: Database
                  type: string
                  description: >-
                    Create it with the "database" template first, then pick it here. The service
                    is granted access to it and gets its address automatically.
                  ui:field: EntityPicker
                  ui:options:
                    catalogFilter:
                      kind: Resource
                      spec.type: database
                    defaultKind: Resource
              required:
                - database
        needsBuckets:
          oneOf:
            - properties:
                needsBuckets:
                  enum: [false]
            - properties:
                needsBuckets:
                  enum: [true]
                buckets:
                  title: Buckets
                  type: array
                  description: >-
                    Create them with the "s3" template first, then pick them here. Each bucket is
                    updated to grant this service read/write access.
                  items:
                    type: string
                  ui:field: MultiEntityPicker
                  ui:options:
                    catalogFilter:
                      kind: Resource
                      spec.type: object-store
                    defaultKind: Resource
                  default: []
              required:
                - buckets
    - title: AWS services
      properties:
        bedrock:
          title: Bedrock
          type: boolean
          default: false
          description: Lets the service call the approved Bedrock models.
        langfuse:
          title: Langfuse
          type: boolean
          default: false
    - title: Who it talks to
      description: >-
        Everything is denied by default. Each entry opens one direction to one peer, and the
        peer's own configuration is updated in the same change so both ends agree.
      properties:
        allowFrom:
          title: Services allowed to call this one
          type: array
          items:
            type: object
            required: [service, port]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              port:
                title: Port
                type: integer
          default: []
        allowTo:
          title: Services this one may call
          type: array
          items:
            type: object
            required: [service, port]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              port:
                title: Port
                type: integer
          default: []
        egressDomains:
          title: Public addresses it may reach
          type: array
          items:
            type: string
          default: []
          description: Hostnames on the public internet, e.g. "eu.i.posthog.com".

  steps:
    # -----------------------------------------------------------------------------------
    # Several of these steps edit components that already exist, because access is recorded on
    # both sides. A bucket lists the services allowed to use it; a database lists the services
    # granted a login; connectivity needs a rule at each end. The form asks the question once,
    # from the side the developer is thinking about, and the change lands in every manifest it
    # touches — so the pull request shows the whole picture.
    # -----------------------------------------------------------------------------------
    - id: fetch-product
      name: Fetch the product so its components can be updated
      action: fetch:plain
      input:
        url: https://github.com/crossplane-poc/prometeo-products/tree/main/products/${{ parameters.product | parseEntityRef | pick('name') }}
        targetPath: products/${{ parameters.product | parseEntityRef | pick('name') }}

    - id: write-component
      name: Write the service manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: AppService
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            repo: ${{ parameters.repo | dump }}
            containerPort: ${{ parameters.containerPort }}
            modules:
              # Pinned by the platform, not by whoever fills in the form. No released tag accepts
              # the sb3 environment yet: every tag up to v6.5.1 fails the plan with "environment
              # must be one of: sb1, sb2, dev, tst, uat, prd".
              version: ital-1901-add-sb3-environment
            bedrock: ${{ parameters.bedrock }}
            langfuse: ${{ parameters.langfuse }}
          {% if parameters.needsDatabase and parameters.database %}
            database:
              enabled: true
              # Where the database publishes its address. Derived from the component you picked.
              connection: ${{ ((parameters.database | parseEntityRef | pick('name')) + '-connection') | dump }}
          {% endif %}
          {% if parameters.frontend %}
            ingress:
              enabled: true
              # Host defaults to <product>.<environment domain>.
            sso:
              enabled: true
              # Where the product publishes its SSO WebACL. Derived from the product.
              productConnection: ${{ ((parameters.product | parseEntityRef | pick('name')) + '-connection') | dump }}
          {% endif %}
          {% if (parameters.allowFrom and parameters.allowFrom | length) or (parameters.allowTo and parameters.allowTo | length) or (parameters.egressDomains and parameters.egressDomains | length) %}
            network:
          {% if parameters.allowFrom and parameters.allowFrom | length %}
              allowFrom:
          {% for r in parameters.allowFrom %}
                - { service: ${{ r.service | parseEntityRef | pick('name') }}, port: ${{ r.port }} }
          {% endfor %}
          {% endif %}
          {% if parameters.allowTo and parameters.allowTo | length %}
              allowTo:
          {% for r in parameters.allowTo %}
                - { service: ${{ r.service | parseEntityRef | pick('name') }}, port: ${{ r.port }} }
          {% endfor %}
          {% endif %}
          {% if parameters.egressDomains and parameters.egressDomains | length %}
              egressDomains:
          {% for d in parameters.egressDomains %}
                - ${{ d | dump }}
          {% endfor %}
          {% endif %}
          {% endif %}

    - id: write-catalog-info
      name: Write the catalog entry
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('Service ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
              iag.ai/repo: ${{ parameters.repo | dump }}
          spec:
            type: service
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}
          {% if (parameters.needsDatabase and parameters.database) or (parameters.needsBuckets and parameters.buckets and parameters.buckets | length) %}
            dependsOn:
          {% if parameters.needsDatabase and parameters.database %}
              - ${{ ('resource:default/' + (parameters.database | parseEntityRef | pick('name'))) | dump }}
          {% endif %}
          {% for b in parameters.buckets %}
              - ${{ ('resource:default/' + (b | parseEntityRef | pick('name'))) | dump }}
          {% endfor %}
          {% endif %}

    # Grant this service access on each bucket it uses. Two anchors: the bucket already lists
    # some services, or it lists none at all. fs:replace builds new RegExp(find, 'g') -- no /m,
    # no /s -- so these match on explicit \n, and the second stops before the newline so its
    # lookahead can still see whether an access key follows.
    - id: grant-bucket-access
      name: Grant this service access on each bucket
      each: ${{ parameters.buckets if parameters.needsBuckets else [] }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  access:\n'
            replaceWith: "\n  access:\n    - { service: ${{ parameters.name }}, level: rw }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  access:)'
            replaceWith: "\nspec:\n  access:\n    - { service: ${{ parameters.name }}, level: rw }"

    # Same for the database, whose access list is service names rather than objects.
    - id: grant-database-access
      name: Grant this service a login on the database
      each: ${{ [parameters.database] if (parameters.needsDatabase and parameters.database) else [] }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  access:\n'
            replaceWith: "\n  access:\n    - ${{ parameters.name }}\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  access:)'
            replaceWith: "\nspec:\n  access:\n    - ${{ parameters.name }}"

    - id: mirror-allow-from
      name: Open the other end of each inbound rule
      each: ${{ parameters.allowFrom }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowTo:\n'
            replaceWith: "\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowTo:)'
            replaceWith: "\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"

    - id: mirror-allow-to
      name: Open the other end of each outbound rule
      each: ${{ parameters.allowTo }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowFrom:\n'
            replaceWith: "\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowFrom:)'
            replaceWith: "\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"

    - id: publish
      name: Open a pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/service-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo service: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds the ${{ parameters.name }} service. Also updates every component it was pointed at —
          each bucket and database grants it access, and each service it talks to gets the matching
          rule — because access is recorded at both ends. Check the whole diff.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
