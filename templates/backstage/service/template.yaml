apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service
  title: "Service"
  description: >-
    A service in a product: its namespace, IAM roles, a deploy role for its repository, network
    policies, and — for a frontend — a public address behind the shared ALB with SSO in front of
    it. Run the "product" template first.
  tags:
    - prometeo
spec:
  owner: guests
  type: service
  parameters:
    - title: About the service
      required:
        - name
        - product
        - repo
      properties:
        name:
          title: Service name
          type: string
          description: e.g. "add-be". Becomes the name of the service and of the namespace its pods run in.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this service belongs to.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        repo:
          title: GitHub repository
          type: string
          description: >-
            The service's own repository, e.g. "iag-mro-add-be". It gets a deploy role, so this is
            what lets the repository's pipeline push images and roll the deployment out.
        frontend:
          title: Is this a frontend?
          type: boolean
          default: false
          description: >-
            A frontend gets a public address on the shared ALB, with the SSO login gate in front
            of it. Everything else is reachable only from inside the cluster.
        containerPort:
          title: Container port
          type: integer
          default: 8000
          description: The port the application listens on. Backends usually 8000, frontends 3000.
        imageRepository:
          title: Image registry path
          type: string
          default: 525426937140.dkr.ecr.eu-west-1.amazonaws.com/ims
          description: >-
            Where the service's pipeline pushes. The service name is appended, so this plus
            "add-fe" is the repository the tag below is looked up in.
        imageTag:
          title: Image tag to run in dev
          type: string
          description: >-
            e.g. "dev-1". Leave it blank if nothing has been built yet -- the service is then
            created without an image and gets no Deployment until a build pins one, which is
            the correct state rather than a broken one.

            The pin lives in this component file. dev renders it at HEAD, so it is live
            immediately; every rung above pins a commit, so the image travels with the
            promotion rather than being copied separately. Builds replace it with a digest.
    - title: What it connects to
      properties:
        # Two nested objects rather than two checkboxes side by side. A nested object renders as
        # its own titled group, so the picker a checkbox reveals appears directly under that
        # checkbox — with both on the flat page, one dependencies map put every revealed field
        # after both boxes.
        database:
          title: Database
          type: object
          properties:
            needed:
              title: Does it use a database?
              type: boolean
              default: false
          dependencies:
            needed:
              oneOf:
                - properties:
                    needed:
                      enum: [false]
                - properties:
                    needed:
                      enum: [true]
                    component:
                      title: Which one
                      type: string
                      description: >-
                        Create it with the "database" template first, then pick it here. The
                        service is granted access to it and gets its address automatically.
                      ui:field: EntityPicker
                      ui:options:
                        catalogFilter:
                          kind: Resource
                          spec.type: database
                        defaultKind: Resource
                  required:
                    - component
        buckets:
          title: S3 buckets
          type: object
          properties:
            needed:
              title: Does it use any S3 buckets?
              type: boolean
              default: false
          dependencies:
            needed:
              oneOf:
                - properties:
                    needed:
                      enum: [false]
                - properties:
                    needed:
                      enum: [true]
                    components:
                      title: Which ones
                      type: array
                      description: >-
                        Create them with the "s3" template first, then pick them here. Each bucket
                        is updated to grant this service the access you choose.
                      items:
                        type: object
                        required: [bucket, level]
                        properties:
                          bucket:
                            title: Bucket
                            type: string
                            ui:field: EntityPicker
                            ui:options:
                              catalogFilter:
                                kind: Resource
                                spec.type: object-store
                              defaultKind: Resource
                          level:
                            title: Access
                            type: string
                            enum: [ro, rw]
                            enumNames: ["Read only", "Read and write"]
                            default: rw
                      default: []
                  required:
                    - components
    - title: AWS services
      properties:
        bedrock:
          title: Bedrock
          type: boolean
          default: false
          description: Lets the service call the approved Bedrock models.
        langfuse:
          title: Langfuse
          type: boolean
          default: false
    - title: Who it talks to
      description: >-
        Everything is denied by default. Each entry opens one direction to one peer, and the
        peer's own configuration is updated in the same change so both ends agree.
      properties:
        allowFrom:
          title: Services allowed to call this one
          type: array
          description: They reach this service on its own container port, answered above.
          items:
            type: object
            required: [service]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
          default: []
        allowTo:
          title: Services this one may call
          type: array
          description: >-
            No port to pick here either: each one is looked up in the catalog, which records the
            port a service listens on.
          items:
            type: object
            required: [service]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
          default: []
        egressDomains:
          title: Public addresses it may reach
          type: array
          items:
            type: string
          default: []
          description: Hostnames on the public internet, e.g. "eu.i.posthog.com".

  steps:
    # -----------------------------------------------------------------------------------
    # Several of these steps edit components that already exist, because access is recorded on
    # both sides. A bucket lists the services allowed to use it; a database lists the services
    # granted a login; connectivity needs a rule at each end. The form asks the question once,
    # from the side the developer is thinking about, and the change lands in every manifest it
    # touches — so the pull request shows the whole picture.
    # -----------------------------------------------------------------------------------
    - id: fetch-product
      name: Fetch the product so its components can be updated
      action: fetch:plain
      input:
        url: https://github.com/crossplane-poc/prometeo-products/tree/main/products/${{ parameters.product | parseEntityRef | pick('name') }}
        targetPath: products/${{ parameters.product | parseEntityRef | pick('name') }}

    # A service's outbound rules need the port each peer listens on, and the form cannot know
    # it -- an EntityPicker hands back a reference, not the entity. The catalog does know: every
    # service's Component entity carries iag.ai/container-port, written by this template. One
    # query for the whole product, then a join, rather than a lookup per peer.
    - id: fetch-peer-ports
      name: Look up the ports the chosen services listen on
      action: http:backstage:request
      input:
        method: GET
        # Plugin-relative, not the browser URL. This action reads the first path segment as a
        # plugin id and asks discovery where that plugin lives, so "/api/catalog/..." resolves
        # plugin "api" and requests <backend>/api/api/catalog/... -- a 404 with an empty body,
        # which is what both earlier attempts hit. "/catalog/..." resolves plugin "catalog".
        path: /catalog/entities?filter=kind=component,spec.system=${{ parameters.product | parseEntityRef | pick('name') }}&fields=metadata.name,metadata.annotations

    - id: resolve-allow-to
      name: Pair each chosen service with its port
      action: roadiehq:utils:jsonata
      input:
        data:
          picked: ${{ parameters.allowTo }}
          catalog: ${{ steps['fetch-peer-ports'].output.body }}
        # /catalog/entities returns a bare array; /catalog/entities/by-query returns { items }.
        # The expression accepts either shape so a later Backstage cannot quietly break it.
        #
        # The [ ... ] around the whole thing forces an array. Without it JSONata returns a bare
        # object when exactly one service is picked and nothing at all when none is, and the
        # step that consumes this iterates whatever it gets: given {service, port} it walks the
        # object's entries, so `each` yields {"key":"service","value":"frontend"} and the file
        # path renders as base/.yaml. Two or more picks return an array and work, which is why
        # this only broke on a single one.
        #
        # $$ is the root: inside picked.(...) the context is the row, so the catalog has to be
        # reached from the top or every lookup silently misses and every port comes back as
        # the fallback.
        #
        # 8000 is that fallback, for a service whose entity predates this annotation. It is a
        # guess, and a wrong one for a frontend -- the pull request shows the port, so it can
        # be corrected there.
        expression: |
          (
            $list := $exists($$.catalog.items) ? $$.catalog.items : $$.catalog;
            [ picked.(
              $name := $split(service, "/")[-1];
              $ann := $list[metadata.name = $name].metadata.annotations.`iag.ai/container-port`;
              {
                "service": $name,
                "port": $number($ann ? $ann : "8000")
              }
            ) ]
          )

    - id: write-component
      name: Write the service manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |-
          {%- set resolvedAllowTo = steps['resolve-allow-to'].output.result -%}
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: AppService
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            repo: ${{ parameters.repo | dump }}
            containerPort: ${{ parameters.containerPort }}
          {%- if parameters.imageTag %}
            image: ${{ parameters.imageRepository }}/${{ parameters.name }}:${{ parameters.imageTag }}
          {%- endif %}
            modules:
              # Pinned by the platform, not by whoever fills in the form. No released tag accepts
              # the sb3 environment yet: every tag up to v6.5.1 fails the plan with "environment
              # must be one of: sb1, sb2, dev, tst, uat, prd".
              version: ital-1901-add-sb3-environment
            bedrock: ${{ parameters.bedrock }}
            langfuse: ${{ parameters.langfuse }}
          {%- if parameters.database and parameters.database.needed and parameters.database.component %}
            database:
              enabled: true
              # Where the database publishes its address. Derived from the component you picked.
              connection: ${{ ((parameters.database.component | parseEntityRef | pick('name')) + '-connection') | dump }}
          {%- endif %}
          {%- if parameters.frontend %}
            ingress:
              enabled: true
              # Host defaults to <product>.<environment domain>.
            sso:
              enabled: true
              # Where the product publishes its SSO WebACL. Derived from the product.
              productConnection: ${{ ((parameters.product | parseEntityRef | pick('name')) + '-connection') | dump }}
          {%- endif %}
          {%- if (parameters.allowFrom and parameters.allowFrom | length) or (resolvedAllowTo and resolvedAllowTo | length) or (parameters.egressDomains and parameters.egressDomains | length) %}
            network:
          {%- if parameters.allowFrom and parameters.allowFrom | length %}
              allowFrom:
          {%- for r in parameters.allowFrom %}
                - { service: ${{ r.service | parseEntityRef | pick('name') }}, port: ${{ parameters.containerPort }} }
          {%- endfor %}
          {%- endif %}
          {%- if resolvedAllowTo and resolvedAllowTo | length %}
              allowTo:
          {%- for r in resolvedAllowTo %}
                - { service: ${{ r.service }}, port: ${{ r.port }} }
          {%- endfor %}
          {%- endif %}
          {%- if parameters.egressDomains and parameters.egressDomains | length %}
              egressDomains:
          {%- for d in parameters.egressDomains %}
                - ${{ d | dump }}
          {%- endfor %}
          {%- endif %}
          {%- endif %}

    - id: write-catalog-info
      name: Write the catalog entry
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/catalog/${{ parameters.name }}.yaml
        content: |-
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('Service ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
              iag.ai/repo: ${{ parameters.repo | dump }}
              # Read back by this same template when another service picks this one under
              # "services this one may call". Without it that lookup falls back to 8000.
              iag.ai/container-port: ${{ parameters.containerPort | string | dump }}
          spec:
            type: service
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}
          {%- if (parameters.database and parameters.database.needed and parameters.database.component) or (parameters.buckets and parameters.buckets.needed and parameters.buckets.components and parameters.buckets.components | length) %}
            dependsOn:
          {%- if parameters.database and parameters.database.needed and parameters.database.component %}
              - ${{ ('resource:default/' + (parameters.database.component | parseEntityRef | pick('name'))) | dump }}
          {%- endif %}
          {%- for b in (parameters.buckets.components if (parameters.buckets and parameters.buckets.needed) else []) %}
              - ${{ ('resource:default/' + (b.bucket | parseEntityRef | pick('name'))) | dump }}
          {%- endfor %}
          {%- endif %}

    # Grant this service access on each bucket it uses. Two anchors: the bucket already lists
    # some services, or it lists none at all. fs:replace builds new RegExp(find, 'g') -- no /m,
    # no /s -- so these match on explicit \n, and the second stops before the newline so its
    # lookahead can still see whether an access key follows.
    - id: grant-bucket-access
      name: Grant this service access on each bucket
      each: ${{ parameters.buckets.components if (parameters.buckets and parameters.buckets.needed) else [] }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.bucket | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  access:\n'
            replaceWith: "\n  access:\n    - { service: ${{ parameters.name }}, level: ${{ each.value.level }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.bucket | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  access:)'
            replaceWith: "\nspec:\n  access:\n    - { service: ${{ parameters.name }}, level: ${{ each.value.level }} }"

    # Same for the database, whose access list is service names rather than objects.
    - id: grant-database-access
      name: Grant this service a login on the database
      each: ${{ [parameters.database.component] if (parameters.database and parameters.database.needed and parameters.database.component) else [] }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  access:\n'
            replaceWith: "\n  access:\n    - ${{ parameters.name }}\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  access:)'
            replaceWith: "\nspec:\n  access:\n    - ${{ parameters.name }}"

    - id: mirror-allow-from
      name: Open the other end of each inbound rule
      each: ${{ parameters.allowFrom }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowTo:\n'
            replaceWith: "\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ parameters.containerPort }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowTo:)'
            replaceWith: "\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ parameters.containerPort }} }"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ parameters.containerPort }} }"

    - id: mirror-allow-to
      name: Open the other end of each outbound rule
      each: ${{ steps['resolve-allow-to'].output.result }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service }}.yaml
            matchRegex: true
            find: '\n    allowFrom:\n'
            replaceWith: "\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowFrom:)'
            replaceWith: "\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"

    - id: publish
      name: Open a pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/service-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo service: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds the ${{ parameters.name }} service. Also updates every component it was pointed at —
          each bucket and database grants it access, and each service it talks to gets the matching
          rule — because access is recorded at both ends. Check the whole diff.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
    text:
      # A text blob rather than a second link, because a link's url has minLength: 1 in the
      # scaffolder's own schema — there is no way to render one only for a frontend. This says
      # something useful either way.
      - title: How to access the service
        content: |-
          {%- if parameters.frontend %}
          **https://${{ parameters.product | parseEntityRef | pick('name') }}.sb3.ims.iag.ai**

          Live once the pull request is merged and the product is synced. The address belongs to
          the product, so a second frontend in the same product needs `spec.ingress.host` set to
          something else.
          {%- else %}
          Reachable only from inside the cluster, at
          `${{ parameters.name }}.${{ parameters.name }}.svc.cluster.local:${{ parameters.containerPort }}`.
          Nothing outside the VPC can reach it. Re-run this template with "is this a frontend?"
          ticked to publish it.
          {%- endif %}
