apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service
  title: "Service"
  description: >-
    One service in a product, built from tf-common-modules/modules/bootstrap-service by
    Crossplane's Terraform provider: its namespace, IAM roles, deploy role, network policies and
    optionally an ingress behind the shared ALB. Run the "product" template first.
  tags:
    - prometeo
spec:
  owner: guests
  type: service
  parameters:
    - title: Placement
      required:
        - name
        - product
        - repo
      properties:
        name:
          title: Service name
          type: string
          description: e.g. "add-be". Becomes the XR name and the Kubernetes namespace Terraform creates for the pods.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this service belongs to (run the "product" template first).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        repo:
          title: GitHub repository
          type: string
          description: >-
            The application's own repository, e.g. "iag-mro-add-be". It gets an OIDC deploy role,
            so this is how the app's pipeline is allowed to push images and roll the deployment.
        containerPort:
          title: Container port
          type: integer
          default: 8000
          description: Backends typically use 8000/8001, frontends 3000.
        modulesVersion:
          title: tf-common-modules version
          type: string
          default: ital-1901-add-sb3-environment
          description: >-
            Tag or branch this component is pinned to. No released tag accepts the sb3 environment
            yet, so this points at the ITAL-1901 branch.
    - title: AWS services
      properties:
        bedrock:
          title: Bedrock
          type: boolean
          default: false
        langfuse:
          title: Langfuse
          type: boolean
          default: false
        databaseEnabled:
          title: Connect to the product's database
          type: boolean
          default: false
          description: >-
            Opens the network path to the database subnets and takes rds-db:connect, which the
            PostgresDatabase grants by naming this service in its access list.
        databaseConnection:
          title: Database connection ConfigMap
          type: string
          description: >-
            Only when the database is not this product's default — the <name>-connection ConfigMap
            a PostgresDatabase publishes, e.g. "add-db-connection".
    - title: Ingress
      properties:
        ingressEnabled:
          title: Is this service an ingress?
          type: boolean
          default: false
          description: >-
            Yes publishes it on the shared ALB. The host defaults to <product>.<environment
            domain>; edit the manifest in the PR to override it.
        ssoEnabled:
          title: Put it behind the SSO gate
          type: boolean
          default: false
          description: >-
            CloudFront plus Cognito in front of the ingress. The client id is read from SSM during
            the apply, so there is nothing to set here.
        ssoProductConnection:
          title: Product connection ConfigMap
          type: string
          description: >-
            Only with SSO — the ConfigMap holding SSO_WEB_ACL_ARN, which the Product publishes as
            <product>-connection. The WebACL ARN contains a generated id, so unlike every other
            cross-component value it cannot be derived from a name.
    - title: Network
      description: >-
        Everything is denied by default. Each entry opens one direction to one peer on one port,
        and the peer's own manifest is edited in the same PR so both ends agree.
      properties:
        allowFrom:
          title: Allow from
          type: array
          description: Services allowed to call this one.
          items:
            type: object
            required: [service, port]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              port:
                title: Port
                type: integer
          default: []
        allowTo:
          title: Allow to
          type: array
          description: Services this one may call.
          items:
            type: object
            required: [service, port]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              port:
                title: Port
                type: integer
          default: []
        egressDomains:
          title: Public hostnames
          type: array
          items:
            type: string
          default: []
          description: Hostnames this service may reach on 443, e.g. ["eu.i.posthog.com"].

  steps:
    # -----------------------------------------------------------------------------------
    # Connectivity is two-ended, so the peer's manifest has to change too. An allowFrom entry
    # naming add-fe opens this service's ingress; add-fe's matching egress can only be written
    # into add-fe's own manifest. These steps fetch the product and mirror each rule into its
    # peer, so one form fill-in opens the connection end to end and the PR shows both sides.
    # -----------------------------------------------------------------------------------
    - id: fetch-product
      name: Fetch the product so peers can be patched
      action: fetch:plain
      input:
        url: https://github.com/crossplane-poc/prometeo-products/tree/main/products/${{ parameters.product | parseEntityRef | pick('name') }}
        targetPath: products/${{ parameters.product | parseEntityRef | pick('name') }}

    - id: write-component
      name: Write the AppService manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: AppService
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            repo: ${{ parameters.repo | dump }}
            containerPort: ${{ parameters.containerPort }}
            modules:
              version: ${{ parameters.modulesVersion | dump }}
            bedrock: ${{ parameters.bedrock }}
            langfuse: ${{ parameters.langfuse }}
          {% if parameters.databaseEnabled %}
            database:
              enabled: true
          {% if parameters.databaseConnection %}
              connection: ${{ parameters.databaseConnection | dump }}
          {% endif %}
          {% endif %}
          {% if parameters.ingressEnabled %}
            ingress:
              enabled: true
              # Host defaults to <product>.<environment domain>.
          {% endif %}
          {% if parameters.ssoEnabled %}
            sso:
              enabled: true
          {% if parameters.ssoProductConnection %}
              productConnection: ${{ parameters.ssoProductConnection | dump }}
          {% endif %}
          {% endif %}
          {% if (parameters.allowFrom and parameters.allowFrom | length) or (parameters.allowTo and parameters.allowTo | length) or (parameters.egressDomains and parameters.egressDomains | length) %}
            network:
          {% if parameters.allowFrom and parameters.allowFrom | length %}
              allowFrom:
          {% for r in parameters.allowFrom %}
                - { service: ${{ r.service | parseEntityRef | pick('name') }}, port: ${{ r.port }} }
          {% endfor %}
          {% endif %}
          {% if parameters.allowTo and parameters.allowTo | length %}
              allowTo:
          {% for r in parameters.allowTo %}
                - { service: ${{ r.service | parseEntityRef | pick('name') }}, port: ${{ r.port }} }
          {% endfor %}
          {% endif %}
          {% if parameters.egressDomains and parameters.egressDomains | length %}
              egressDomains:
          {% for d in parameters.egressDomains %}
                - ${{ d | dump }}
          {% endfor %}
          {% endif %}
          {% endif %}

    - id: write-catalog-info
      name: Write the Backstage Component entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('AppService ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
              iag.ai/repo: ${{ parameters.repo | dump }}
          spec:
            type: service
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: mirror-allow-from
      name: Mirror each "allow from" rule as the peer's allowTo
      each: ${{ parameters.allowFrom }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          # Four mutually exclusive anchors, applied in order: whichever shape the peer's file is
          # in, exactly one can match. Each is a pure insertion, so the peer keeps its comments.
          # A peer that is not in this product is a silent no-op, visible as a missing side in the
          # PR diff. fs:replace builds new RegExp(find, 'g') -- no /m, no /s -- so these match on
          # explicit \n. Anchors 3 and 4 stop before the newline on purpose: consuming it hides
          # the separator the lookahead needs and makes two anchors fire.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowTo:\n'
            replaceWith: "\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowTo: \[\]\n'
            replaceWith: "\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowTo:)'
            replaceWith: "\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"

    - id: mirror-allow-to
      name: Mirror each "allow to" rule as the peer's allowFrom
      each: ${{ parameters.allowTo }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowFrom:\n'
            replaceWith: "\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowFrom: \[\]\n'
            replaceWith: "\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }\n"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowFrom:)'
            replaceWith: "\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }}, port: ${{ each.value.port }} }"

    - id: publish
      name: Open a PR with the new service
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/service-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo service: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml`
          (an AppService) and its Backstage Component entity. Also edits each peer named under
          "allow from" / "allow to": connectivity needs a rule at both ends and the peer's rule
          can only live in the peer's own manifest. Check both sides of the diff — a peer outside
          this product is skipped silently.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
