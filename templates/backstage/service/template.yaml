apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service
  title: "Service"
  description: >-
    One runnable service (a Deployment, its AWS identity, its network rules) — a Prometeo
    AppService. Replaces tf-common-modules/modules/bootstrap-service. The product must already
    exist (run the "product" template first).
  tags:
    - prometeo
spec:
  owner: guests
  type: service
  parameters:
    - title: Placement
      required:
        - name
        - product
        - image
      properties:
        name:
          title: Service name
          type: string
          description: >-
            e.g. "add-fe". Becomes the XR name and its own namespace (one namespace per service,
            not per product).
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this service belongs to (must already exist in prometeo-products).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        image:
          title: Container image
          type: string
          description: Full image ref including tag or digest.
        containerPort:
          title: Container port
          type: integer
          default: 8080
          description: Backends typically use 8000/8001, frontends 3000.
    - title: Runtime
      properties:
        env:
          title: Environment variables
          type: object
          additionalProperties:
            type: string
          default: {}
        healthcheckPath:
          title: Health check path
          type: string
          default: /health
          description: >-
            Backends serve one too, which is why this is not under Ingress. Today it only feeds
            the ALB's healthcheck annotation, so it is inert until the service is exposed.
        connections:
          title: Database connection
          type: array
          description: >-
            Databases in this product to connect to. Each one's <name>-connection ConfigMap is
            mounted, supplying DATABASE_HOST/DATABASE_NAME/DATABASE_USER. Leave empty for a
            stateless service.
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: database
            defaultKind: Resource
          default: []
        migrationsEnabled:
          title: Run schema migrations before rollout
          type: boolean
          default: false
    - title: AWS Services
      description: >-
        Opens the matching VPC interface endpoint's NetworkPolicy and grants the IAM. SQS and
        DynamoDB are not here on purpose — a queue or a table is its own component, and declaring
        it grants the access along with it.
      properties:
        awsBedrock:
          title: Bedrock
          type: boolean
          default: false
        awsS3:
          title: S3
          type: boolean
          default: false
        s3Connections:
          title: S3 buckets
          type: array
          description: >-
            Existing buckets in this product to connect to. Each one's <name>-connection
            ConfigMap is mounted, supplying S3_BUCKET. Crossplane ObjectStores only — a bucket
            provisioned by the Terraform template publishes no ConfigMap to mount.
          items:
            type: string
          ui:field: MultiEntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: object-store
            defaultKind: Resource
          default: []
    - title: Ingress
      properties:
        ingressEnabled:
          title: Is this service an ingress?
          type: boolean
          default: false
          description: >-
            Yes puts it behind the shared ALB and points DNS at it. The host defaults to
            <product>.<environment domain> and DNS defaults to on; both are XRD defaults you can
            still override by editing the manifest in the PR.
    - title: Network
      description: >-
        Everything is denied by default; each entry opens one direction to one peer. The port is
        never asked for because it is never a choice: a connection is only allowed when both ends
        permit it, and the receiving end always pins it to its own container port. So the
        ingress rule uses this service's container port, and the egress rule needs no port at all
        — the peer's own ingress rule is what constrains it.
      properties:
        allowFrom:
          title: Allow from
          type: array
          description: Services that may call this one. No port to pick — see the section note.
          items:
            type: object
            required: [service]
            properties:
              service:
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
          default: []
        allowTo:
          title: Allow to
          type: array
          description: Services that may this one may call. No port to pick — see the section note.
          items:
            type: object
            required: [service]
            properties:
              service:
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
          default: []

  steps:
    # -----------------------------------------------------------------------------------
    # Connectivity is two-ended, so the peer's manifest has to change too.
    #
    # A NetworkPolicy can only select pods in its own namespace, and every service IS its own
    # namespace. So an `allowFrom` entry naming tief-fe renders this service's ingress rule and
    # nothing else — tief-fe's egress rule can only be written into tief-fe's namespace, by
    # tief-fe's own XR. On top of that, `allowTo` is what emits <PEER>_HOST into the caller's
    # base envs (app-service composition, "One <PEER>_HOST per declared outbound dependency"),
    # so the caller needs the entry for service discovery even where egress is already open.
    #
    # Both halves therefore live in the peer's file. These steps fetch the existing manifests
    # and mirror each rule into its peer, so one form fills in opens the connection end to end
    # and the PR shows both sides.
    # -----------------------------------------------------------------------------------
    - id: fetch-products
      name: Fetch the existing manifests so peers can be patched
      action: fetch:plain
      input:
        # Only this product: connectivity is scoped to the product, so a peer is always a
        # sibling in the same directory.
        url: https://github.com/crossplane-poc/prometeo-products/tree/main/products/${{ parameters.product | parseEntityRef | pick('name') }}
        targetPath: products/${{ parameters.product | parseEntityRef | pick('name') }}

    - id: write-component
      name: Write the AppService manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.name }}
            labels:
              name: ${{ parameters.name }}
              service: ${{ parameters.name }}
              product: ${{ parameters.product | parseEntityRef | pick('name') }}
              platform: prometeo
              admission.datadoghq.com/enabled: "true"
          ---
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: AppService
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.name }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            image: ${{ parameters.image | dump }}
            containerPort: ${{ parameters.containerPort }}
            replicas: 1
          {% if parameters.env and parameters.env | length %}
            env:
          {% for k, v in parameters.env %}
              ${{ k }}: ${{ v | dump }}
          {% endfor %}
          {% endif %}
          {# Two form fields, one spec field. Kept as two loops rather than one merged list:
             nunjucks `+` on two arrays coerces them to a string, which iterates per character. #}
          {% if (parameters.connections and parameters.connections | length) or (parameters.s3Connections and parameters.s3Connections | length) %}
            connections:
          {% for c in parameters.connections %}
              - ${{ c | parseEntityRef | pick('name') }}
          {% endfor %}
          {% for c in parameters.s3Connections %}
              - ${{ c | parseEntityRef | pick('name') }}
          {% endfor %}
          {% endif %}
            migrations:
              enabled: ${{ parameters.migrationsEnabled }}
            aws:
              bedrock: ${{ parameters.awsBedrock }}
              s3: ${{ parameters.awsS3 }}
            ingress:
              enabled: ${{ parameters.ingressEnabled }}
              healthcheckPath: ${{ parameters.healthcheckPath | dump }}
          {% if (parameters.allowFrom and parameters.allowFrom | length) or (parameters.allowTo and parameters.allowTo | length) %}
            network:
          {% if parameters.allowFrom and parameters.allowFrom | length %}
              allowFrom:
          {% for r in parameters.allowFrom %}
                - service: ${{ r.service | parseEntityRef | pick('name') }}
          {% endfor %}
          {% endif %}
          {% if parameters.allowTo and parameters.allowTo | length %}
              allowTo:
          {% for r in parameters.allowTo %}
                - service: ${{ r.service | parseEntityRef | pick('name') }}
          {% endfor %}
          {% endif %}
          {% endif %}

    - id: write-catalog-info
      name: Write the Backstage Component entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('AppService ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-label-selector: 'service=${{ parameters.name }}'
          spec:
            type: service
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: mirror-allow-from
      name: Mirror each "allow from" rule as the peer's allowTo
      each: ${{ parameters.allowFrom }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          # Four mutually exclusive anchors, applied in order: whichever shape the peer's
          # file is in, exactly one of them can match. Each is a pure insertion, so the
          # peer keeps its comments. The path is pinned to this product: a peer outside it
          # is not a legal target. No match (a typo, or a peer not in this product) is a
          # silent no-op, visible as a missing side in the PR diff.
          # 1. The key is already a block list -- insert at its head.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowTo:\n'
            replaceWith: "\n    allowTo:\n      - { service: ${{ parameters.name }} }\n"
          # 2. The key is there but empty (`allowTo: []`, the XRD default) -- open a block list.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowTo: \[\]\n'
            replaceWith: "\n    allowTo:\n      - { service: ${{ parameters.name }} }\n"
          # 3. A network: block with no allowTo key at all -- add the key. The anchor stops
          #    at `network:` without taking the newline: the lookahead needs that newline
          #    left in place to recognise a key sitting on the very next line.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowTo:)'
            replaceWith: "\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }} }"
          # 4. No network: block at all (lookahead) -- open one directly under spec:.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowTo:\n      - { service: ${{ parameters.name }} }"

    - id: mirror-allow-to
      name: Mirror each "allow to" rule as the peer's allowFrom
      each: ${{ parameters.allowTo }}
      action: roadiehq:utils:fs:replace
      input:
        files:
          # Four mutually exclusive anchors, applied in order: whichever shape the peer's
          # file is in, exactly one of them can match. Each is a pure insertion, so the
          # peer keeps its comments. The path is pinned to this product: a peer outside it
          # is not a legal target. No match (a typo, or a peer not in this product) is a
          # silent no-op, visible as a missing side in the PR diff.
          # 1. The key is already a block list -- insert at its head.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowFrom:\n'
            replaceWith: "\n    allowFrom:\n      - { service: ${{ parameters.name }} }\n"
          # 2. The key is there but empty (`allowFrom: []`, the XRD default) -- open a block list.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n    allowFrom: \[\]\n'
            replaceWith: "\n    allowFrom:\n      - { service: ${{ parameters.name }} }\n"
          # 3. A network: block with no allowFrom key at all -- add the key. The anchor stops
          #    at `network:` without taking the newline: the lookahead needs that newline
          #    left in place to recognise a key sitting on the very next line.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\n  network:(?![\s\S]*\n    allowFrom:)'
            replaceWith: "\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }} }"
          # 4. No network: block at all (lookahead) -- open one directly under spec:.
          - file: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ each.value.service | parseEntityRef | pick('name') }}.yaml
            matchRegex: true
            find: '\nspec:(?![\s\S]*\n  network:)'
            replaceWith: "\nspec:\n  network:\n    allowFrom:\n      - { service: ${{ parameters.name }} }"
    - id: publish
      name: Open a PR with the new service
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/service-${{ parameters.name }}
        title: 'prometeo service: ${{ parameters.name }}'
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml` (Namespace +
          AppService) and its Backstage Component entity, via the "service" template.


          Also edits each peer named in "allow from" / "allow to": connectivity needs a rule at
          both ends, and the peer's rule can only be written in the peer's own manifest. Check
          both sides of the diff — a peer outside this product is skipped silently.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
