apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: database
  title: "PostgreSQL database"
  description: >-
    An Aurora PostgreSQL cluster in a product, built from tf-common-modules/modules/rds by
    Crossplane's Terraform provider. Run the "product" template first.
  tags:
    - prometeo
spec:
  owner: guests
  type: resource
  parameters:
    - title: About the database
      required:
        - name
        - product
      properties:
        name:
          title: Database component name
          type: string
          description: e.g. "add-db". Becomes the XR name; the cluster lives in the product's namespace.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this database belongs to (run the "product" template first).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
    - title: Engine
      properties:
        engineVersion:
          title: PostgreSQL version
          type: string
          # Checked against `aws rds describe-db-engine-versions --engine aurora-postgresql` in
          # eu-west-1: the newest of each major that is available and not a -limitless variant.
          # 16.11 is what the environment defaults to, so it stays the default here.
          enum: ["16.11", "16.14", "17.10", "18.4"]
          enumNames:
            - "16.11 (default)"
            - "16.14"
            - "17.10"
            - "18.4"
          default: "16.11"
          description: >-
            Everything else about the cluster — its name, size and instance count — comes from
            the environment's defaults.
    - title: Access
      properties:
        access:
          title: Services granted rds-db:connect
          type: array
          items:
            type: string
            ui:field: EntityPicker
            ui:options:
              catalogFilter:
                kind: Component
              defaultKind: Component
          default: []
          description: >-
            Each entry grants that service's IAM role IAM auth on the database and mirrors this
            component's connection ConfigMap into its namespace.

  steps:
    - id: write-component
      name: Write the PostgresDatabase manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |-
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: PostgresDatabase
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            modules:
              # Pinned by the platform, not by whoever fills in the form. No released tag accepts
              # the sb3 environment yet: every tag up to v6.5.1 fails the plan with "environment
              # must be one of: sb1, sb2, dev, tst, uat, prd".
              version: ital-1901-add-sb3-environment
            # The database name defaults to <product>db, and the sizing — ACU floor and
            # ceiling, instance count — comes from the environment. None of it is worth asking.
            engineVersion: ${{ parameters.engineVersion | dump }}
            # The parameter group family has to match the engine's major version. It is a
            # separate field on the XRD, so picking 18.4 while family stayed at
            # aurora-postgresql16 would fail the apply. Spelled out rather than derived by
            # string-splitting, which the scaffolder's sandbox may not allow.
          {%- if parameters.engineVersion == "18.4" %}
            family: aurora-postgresql18
          {%- elif parameters.engineVersion == "17.10" %}
            family: aurora-postgresql17
          {%- else %}
            family: aurora-postgresql16
          {%- endif %}
          {%- if parameters.access and parameters.access | length %}
            access:
          {%- for a in parameters.access %}
              - ${{ a | parseEntityRef | pick('name') }}
          {%- endfor %}
          {%- endif %}
            # Both on by every time: port-forward access from a laptop, and the Lambda that
            # creates the IAM-auth users an application logs in as. Neither is a decision worth
            # putting in front of whoever is creating a database.
            k8sAccess: true
            bootstrapLambda: true

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |-
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('PostgresDatabase ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            type: database
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with the new database
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/database-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo database: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml`
          (a PostgresDatabase) and its Backstage Resource entity. Syncing the product in ArgoCD
          runs tf-common-modules/modules/rds and creates the Aurora cluster.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
