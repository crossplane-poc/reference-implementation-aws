apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: database
  title: "Database"
  description: >-
    An Aurora PostgreSQL Serverless v2 cluster — a Prometeo PostgresDatabase. Replaces
    tf-common-modules/modules/rds. Use this only for a database shared by more than one service;
    a database private to one backend belongs on the "statefulbackend" template instead. The
    product must already exist (run the "product" template first).
  tags:
    - prometeo
spec:
  owner: guests
  type: resource
  parameters:
    - title: Placement
      required:
        - name
        - product
        - namespace
      properties:
        name:
          title: Database component name
          type: string
          description: e.g. "db". Becomes the XR name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this database belongs to (must already exist in prometeo-products).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        namespace:
          title: Namespace
          type: string
          description: >-
            Shared by more than one service? Use "<product>-<name>" (e.g. "cms-db") and it'll be
            created for you. Private to one service? Use that service's own namespace instead —
            and prefer the "statefulbackend" template, which bundles this for you.
        databaseName:
          title: Database name inside the cluster
          type: string
          description: Defaults to "<product>db" (hyphens removed) when left blank.
    - title: Sizing and access
      properties:
        engineVersion:
          title: Aurora PostgreSQL version
          type: string
        minACU:
          title: Min ACU
          type: number
        maxACU:
          title: Max ACU
          type: number
        instances:
          title: Instances
          type: integer
          default: 1
          description: 1 for single-AZ, 2 for HA.
        schemas:
          title: Schemas to create at bootstrap
          type: array
          items:
            type: string
          default: []
        access:
          title: Service access
          type: array
          description: Services allowed to authenticate with IAM against this database.
          items:
            type: object
            required: [service]
            properties:
              service:
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              level:
                type: string
                enum: [connect, admin]
                default: connect
          default: []
        backupRetentionDays:
          title: Backup retention (days)
          type: integer
          default: 7
        deletionProtection:
          title: Deletion protection
          type: boolean
          default: false
          description: Leave off outside prd — turning it on blocks deletion until it's turned off again.

  steps:
    - id: write-component
      name: Write the PostgresDatabase manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          # The Namespace object is repeated harmlessly if this database shares a namespace with
          # another component already declaring it (kustomize/kubectl apply is idempotent on an
          # identical object) — kept self-contained per file rather than centralized, since
          # Backstage template runs are stateless and can't append to a shared namespaces.yaml.
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.namespace }}
            labels:
              name: ${{ parameters.namespace }}
              product: ${{ parameters.product | parseEntityRef | pick('name') }}
              platform: prometeo
          ---
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: PostgresDatabase
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.namespace }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
          {% if parameters.databaseName %}
            databaseName: ${{ parameters.databaseName | dump }}
          {% endif %}
          {% if parameters.engineVersion %}
            engineVersion: ${{ parameters.engineVersion | dump }}
          {% endif %}
          {% if parameters.schemas and parameters.schemas | length %}
            schemas:
          {% for s in parameters.schemas %}
              - ${{ s }}
          {% endfor %}
          {% endif %}
            capacity:
              instances: ${{ parameters.instances }}
          {% if parameters.minACU %}
              minACU: ${{ parameters.minACU }}
          {% endif %}
          {% if parameters.maxACU %}
              maxACU: ${{ parameters.maxACU }}
          {% endif %}
          {% if parameters.access and parameters.access | length %}
            access:
          {% for a in parameters.access %}
              - service: ${{ a.service | parseEntityRef | pick('name') }}
                level: ${{ a.level }}
          {% endfor %}
          {% endif %}
            backupRetentionDays: ${{ parameters.backupRetentionDays }}
            deletionProtection: ${{ parameters.deletionProtection }}

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('PostgresDatabase ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.namespace }}
          spec:
            type: database
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with the new database
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/database-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo database: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml` (PostgresDatabase)
          and its Backstage Resource entity, via the "database" template.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
