apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: database
  title: "PostgreSQL database"
  description: >-
    An Aurora PostgreSQL cluster in a product, built from tf-common-modules/modules/rds by
    Crossplane's Terraform provider. Run the "product" template first.
  tags:
    - prometeo
spec:
  owner: guests
  type: resource
  parameters:
    - title: Placement
      required:
        - name
        - product
      properties:
        name:
          title: Database component name
          type: string
          description: e.g. "add-db". Becomes the XR name; the cluster lives in the product's namespace.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this database belongs to (run the "product" template first).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        modulesVersion:
          title: tf-common-modules version
          type: string
          default: ital-1901-add-sb3-environment
          description: >-
            Tag or branch this component is pinned to. No released tag accepts the sb3 environment
            yet, so this points at the ITAL-1901 branch.
    - title: The cluster
      properties:
        databaseName:
          title: Database name
          type: string
          description: Defaults to "<product>db" with hyphens removed.
        engineVersion:
          title: Engine version
          type: string
          description: Defaults to the environment's setting, e.g. "16.11".
        instanceCount:
          title: Instances
          type: integer
          default: 1
          description: 1 for a single writer, 2 to add a reader.
        minACU:
          title: Minimum ACUs
          type: number
          description: Serverless v2 floor. Blank takes the environment's default.
        maxACU:
          title: Maximum ACUs
          type: number
          description: Serverless v2 ceiling. Blank takes the environment's default.
    - title: Access
      properties:
        access:
          title: Services granted rds-db:connect
          type: array
          items:
            type: string
            ui:field: EntityPicker
            ui:options:
              catalogFilter:
                kind: Component
              defaultKind: Component
          default: []
          description: >-
            Each entry grants that service's IAM role IAM auth on the database and mirrors this
            component's connection ConfigMap into its namespace.
        k8sAccess:
          title: Port-forward access
          type: boolean
          default: true
          description: An HAProxy in a <product>-db-ops namespace, so a laptop can port-forward to the cluster.
        bootstrapLambda:
          title: Create the IAM-auth database users
          type: boolean
          default: true
          description: >-
            The Lambda that creates iam_user, iam_migration_user and admin_iam on first apply.
            Without it an application authenticating with IAM has no role to log in as.

  steps:
    - id: write-component
      name: Write the PostgresDatabase manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: PostgresDatabase
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            modules:
              version: ${{ parameters.modulesVersion | dump }}
          {% if parameters.databaseName %}
            databaseName: ${{ parameters.databaseName | dump }}
          {% endif %}
          {% if parameters.engineVersion %}
            engineVersion: ${{ parameters.engineVersion | dump }}
          {% endif %}
            instanceCount: ${{ parameters.instanceCount }}
          {% if parameters.minACU %}
            minACU: ${{ parameters.minACU }}
          {% endif %}
          {% if parameters.maxACU %}
            maxACU: ${{ parameters.maxACU }}
          {% endif %}
          {% if parameters.access and parameters.access | length %}
            access:
          {% for a in parameters.access %}
              - ${{ a | parseEntityRef | pick('name') }}
          {% endfor %}
          {% endif %}
            k8sAccess: ${{ parameters.k8sAccess }}
            bootstrapLambda: ${{ parameters.bootstrapLambda }}

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('PostgresDatabase ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            type: database
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with the new database
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/database-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo database: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml`
          (a PostgresDatabase) and its Backstage Resource entity. Syncing the product in ArgoCD
          runs tf-common-modules/modules/rds and creates the Aurora cluster.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
