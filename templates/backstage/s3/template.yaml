apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: s3
  title: "S3"
  description: >-
    One S3 bucket, encrypted with its own key, private, versioned — a Prometeo ObjectStore.
    Replaces tf-common-modules/modules/s3 plus its per-product IAM access policy. The product
    must already exist (run the "product" template first).
  tags:
    - prometeo
spec:
  owner: guests
  type: resource
  parameters:
    - title: Placement
      required:
        - name
        - product
      properties:
        name:
          title: Bucket component name
          type: string
          description: e.g. "exports". Becomes the XR name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this bucket belongs to (must already exist in prometeo-products).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        bucketName:
          title: Bucket name
          type: string
          description: >-
            Full bucket name. Defaults to prometeo-<env>-<product>-<component> when left blank —
            S3 names are globally unique, so set this if the default is already taken.
    - title: Lifecycle and access
      properties:
        expirationDays:
          title: Expire objects after (days)
          type: integer
          description: Leave blank to keep objects forever.
        access:
          title: Service access
          type: array
          items:
            type: object
            required: [service]
            properties:
              service:
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              level:
                type: string
                enum: [ro, rw]
                default: rw
          default: []

  steps:
    - id: write-component
      name: Write the ObjectStore manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          # A standalone datastore always lives in its product's namespace — never in a
          # service's. That is a constant, not a judgement call: it never has to move when a
          # second consumer appears, and moving a namespaced XR means delete-and-recreate,
          # which takes the AWS resource with it.
          #
          # Consumers therefore always read <name>-connection across a namespace boundary, so
          # kubernetes-reflector must be installed — the datastore's composition annotates this
          # ConfigMap for every service named in access. See prometeo DEPLOY.md 3.1.
          #
          # The Namespace object is repeated harmlessly by every datastore in this product (kubectl
          # apply is idempotent on an identical object), and since it is only ever the product
          # namespace, it can no longer collide with the richer Namespace a service template
          # writes. Kept self-contained per file rather than centralized: Backstage template
          # runs are stateless and can't append to a shared namespaces.yaml.
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.product | parseEntityRef | pick('name') }}
            labels:
              name: ${{ parameters.product | parseEntityRef | pick('name') }}
              product: ${{ parameters.product | parseEntityRef | pick('name') }}
              platform: prometeo
          ---
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: ObjectStore
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
          {% if parameters.bucketName %}
            bucketName: ${{ parameters.bucketName | dump }}
          {% endif %}
          {% if parameters.expirationDays %}
            expirationDays: ${{ parameters.expirationDays }}
          {% endif %}
          {% if parameters.access and parameters.access | length %}
            access:
          {% for a in parameters.access %}
              - service: ${{ a.service | parseEntityRef | pick('name') }}
                level: ${{ a.level }}
          {% endfor %}
          {% endif %}

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('ObjectStore ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            type: object-store
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with the new bucket
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/s3-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo s3: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml` (ObjectStore) and
          its Backstage Resource entity, via the "s3" template.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
