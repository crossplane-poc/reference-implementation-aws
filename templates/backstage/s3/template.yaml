apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: s3
  title: "S3 bucket"
  description: >-
    One S3 bucket in a product, built from tf-common-modules/modules/s3 by Crossplane's Terraform
    provider. Run the "product" template first.
  tags:
    - prometeo
spec:
  owner: guests
  type: resource
  parameters:
    - title: About the bucket
      required:
        - name
        - product
      properties:
        name:
          title: Bucket component name
          type: string
          description: e.g. "media". Becomes the XR name; the bucket lives in the product's namespace.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this bucket belongs to (run the "product" template first).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
    - title: Behaviour and access
      properties:
        bucketName:
          title: Bucket name
          type: string
          description: >-
            Full bucket name. Defaults to prometeo-<environment>-<product>-<component>. S3 names
            are globally unique, so set this only if the default is taken.
        expirationDays:
          title: Expire objects after (days)
          type: integer
          description: Deletes objects and non-current versions after this many days. Blank keeps them forever.
        access:
          title: Services allowed to use the bucket
          type: array
          items:
            type: object
            required: [service, level]
            properties:
              service:
                title: Service
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              level:
                title: Access
                type: string
                # The XRD's own enum. "r" was offered here and would have been rejected.
                enum: [ro, rw]
                enumNames: ["Read only", "Read and write"]
                default: rw
          default: []
          description: >-
            Each entry attaches a policy to that service's IAM role and mirrors this bucket's
            connection ConfigMap into its namespace.

  steps:
    - id: write-component
      name: Write the ObjectStore manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |-
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: ObjectStore
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
            modules:
              # Pinned by the platform, not by whoever fills in the form. No released tag accepts
              # the sb3 environment yet: every tag up to v6.5.1 fails the plan with "environment
              # must be one of: sb1, sb2, dev, tst, uat, prd".
              version: ital-1901-add-sb3-environment
          {%- if parameters.bucketName %}
            bucketName: ${{ parameters.bucketName | dump }}
          {%- endif %}
          {%- if parameters.expirationDays %}
            expirationDays: ${{ parameters.expirationDays }}
          {%- endif %}
          {%- if parameters.access and parameters.access | length %}
            access:
          {%- for a in parameters.access %}
              - service: ${{ a.service | parseEntityRef | pick('name') }}
                level: ${{ a.level }}
          {%- endfor %}
          {%- endif %}

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |-
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('S3 bucket ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.product | parseEntityRef | pick('name') }}
          spec:
            type: object-store
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with the new bucket
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/s3-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo s3: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml`
          (an ObjectStore) and its Backstage Resource entity. Syncing the product in ArgoCD runs
          tf-common-modules/modules/s3 and creates the bucket.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
