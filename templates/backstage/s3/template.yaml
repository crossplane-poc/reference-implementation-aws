apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: s3
  title: "S3"
  description: >-
    One S3 bucket, encrypted with its own key, private, versioned — a Prometeo ObjectStore.
    Replaces tf-common-modules/modules/s3 plus its per-product IAM access policy. The product
    must already exist (run the "product" template first).
  tags:
    - prometeo
spec:
  owner: guests
  type: resource
  parameters:
    - title: Placement
      required:
        - name
        - product
        - namespace
      properties:
        name:
          title: Bucket component name
          type: string
          description: e.g. "exports". Becomes the XR name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this bucket belongs to (must already exist in prometeo-products).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        namespace:
          title: Namespace
          type: string
          description: >-
            Granted to one service only? Use that service's own namespace. Shared by more than
            one? Use "<product>-<name>" instead.
        bucketName:
          title: Bucket name
          type: string
          description: >-
            Full bucket name. Defaults to prometeo-<env>-<product>-<component> when left blank —
            S3 names are globally unique, so set this if the default is already taken.
    - title: Lifecycle and access
      properties:
        expirationDays:
          title: Expire objects after (days)
          type: integer
          description: Leave blank to keep objects forever.
        access:
          title: Service access
          type: array
          items:
            type: object
            required: [service]
            properties:
              service:
                type: string
                ui:field: EntityPicker
                ui:options:
                  catalogFilter:
                    kind: Component
                  defaultKind: Component
              level:
                type: string
                enum: [ro, rw]
                default: rw
          default: []

  steps:
    - id: write-component
      name: Write the ObjectStore manifest
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml
        content: |
          # The Namespace object is repeated harmlessly if this bucket shares a namespace with
          # another component already declaring it (kustomize/kubectl apply is idempotent on an
          # identical object).
          apiVersion: v1
          kind: Namespace
          metadata:
            name: ${{ parameters.namespace }}
            labels:
              name: ${{ parameters.namespace }}
              product: ${{ parameters.product | parseEntityRef | pick('name') }}
              platform: prometeo
          ---
          apiVersion: platform.prometeo.iag.ai/v1alpha1
          kind: ObjectStore
          metadata:
            name: ${{ parameters.name }}
            namespace: ${{ parameters.namespace }}
          spec:
            product: ${{ parameters.product | parseEntityRef | pick('name') }}
          {% if parameters.bucketName %}
            bucketName: {{ parameters.bucketName | dump }}
          {% endif %}
          {% if parameters.expirationDays %}
            expirationDays: ${{ parameters.expirationDays }}
          {% endif %}
          {% if parameters.access and parameters.access | length %}
            access:
          {% for a in parameters.access %}
              - service: {{ a.service }}
                level: {{ a.level }}
          {% endfor %}
          {% endif %}

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('ObjectStore ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ')') | dump }}
            annotations:
              backstage.io/kubernetes-namespace: ${{ parameters.namespace }}
          spec:
            type: object-store
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with the new bucket
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/s3-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "prometeo s3: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/base/${{ parameters.name }}.yaml` (ObjectStore) and
          its Backstage Resource entity, via the "s3" template.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
