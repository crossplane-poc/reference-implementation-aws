apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: prometeo-templates
  description: >-
    Backstage templates for Prometeo's components. Each writes a Crossplane manifest into
    crossplane-poc/prometeo-products through a pull request; the component runs a tf-common-module
    under provider-terraform once ArgoCD syncs it.
spec:
  targets:
    - ./product/template.yaml
    - ./service/template.yaml
    - ./database/template.yaml
    - ./s3/template.yaml
    - ./delete/template.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: prometeo-products-catalog
  description: Discovers a System entity per product scaffolded into crossplane-poc/prometeo-products
spec:
  type: url
  target: https://github.com/crossplane-poc/prometeo-products/blob/main/catalog-info.yaml
---
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: basic-organization
  description: Basic organization data
spec:
  targets:
    - ./organization/guests.yaml
