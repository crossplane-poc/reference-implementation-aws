apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-s3
  title: "S3 (Terraform PR)"
  description: >-
    PR-Driven IDP spike: one S3 bucket via tf-common-modules/modules/s3. Opens a PR with
    Terraform HCL (not a Crossplane ObjectStore XR). Requires remote state backend configured
    under products/<product>/terraform/. Run the "product" template first.
  tags:
    - prometeo
    - terraform
    - pr-driven-idp
spec:
  owner: guests
  type: resource
  parameters:
    - title: Placement
      required:
        - name
        - product
        - bucketName
      properties:
        name:
          title: Bucket component name
          type: string
          description: e.g. "exports". Used for filenames and catalog entity name.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
        product:
          title: Product
          type: string
          description: The product this bucket belongs to (must already exist in prometeo-products).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System
        bucketName:
          title: Bucket name
          type: string
          description: >-
            Full globally-unique bucket name (e.g. ims-sb3-add-exports).
    - title: Lifecycle
      properties:
        expirationDays:
          title: Expire objects after (days)
          type: integer
          description: Leave blank to keep objects forever.

  steps:
    - id: write-terraform
      name: Write Terraform module call
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/${{ parameters.name }}.tf
        content: |
          # Generated by Backstage template "terraform-s3" (PR-Driven IDP spike).
          # Provisioning: GitHub Actions terraform plan/apply — not ArgoCD/Crossplane.
          module "${{ parameters.name | replace('-', '_') }}" {
            source = "git::https://github.com/IAGAI/tf-common-modules.git//modules/s3?ref=main"

            bucket_name = "${{ parameters.bucketName }}"
          {% if parameters.expirationDays %}
            lifecycle_expiration_days = ${{ parameters.expirationDays }}
          {% endif %}

            tags = {
              product  = "${{ parameters.product | parseEntityRef | pick('name') }}"
              platform = "prometeo"
              managed  = "terraform-pr"
            }
          }

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('S3 bucket ' + parameters.name + ' (product ' + (parameters.product | parseEntityRef | pick('name')) + ', Terraform PR)') | dump }}
            annotations:
              iag.ai/provisioning: terraform-pr
              iag.ai/terraform-path: products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/${{ parameters.name }}.tf
          spec:
            type: s3-bucket
            lifecycle: experimental
            owner: guests
            system: ${{ parameters.product | parseEntityRef | pick('name') }}

    - id: publish
      name: Open a PR with Terraform + catalog entity
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/terraform-s3-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "terraform s3: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          PR-Driven IDP spike. Adds
          `products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/${{ parameters.name }}.tf`
          (tf-common-modules/s3) and its Backstage Resource entity.
          Review the terraform plan before merge — this PR is not auto-merged.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
