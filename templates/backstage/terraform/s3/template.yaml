apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-s3
  title: "S3 (Terraform PR)"
  description: >-
    PR-Driven IDP spike: one S3 bucket via tf-common-modules/modules/s3. Opens a PR with
    Terraform HCL. Requires a Terraform-ready product — run "Bootstrap product (Terraform)"
    first (catalog System must already exist).
  tags:
    - prometeo
    - terraform
    - pr-driven-idp
spec:
  owner: guests
  type: resource
  parameters:
    - title: Placement
      required:
        - name
        - product
      properties:
        product:
          title: Product
          type: string
          description: >-
            Terraform-ready System only (run "Bootstrap product (Terraform)" first).
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
              metadata.annotations.iag.ai/terraform-backend: configured
            defaultKind: System
        name:
          title: Bucket suffix
          type: string
          description: >-
            Appended to the fixed prefix prometeo-sb3-<product>-. Example suffix "exports"
            becomes prometeo-sb3-labellingtool-exports.
          pattern: '^[a-z][a-z0-9-]*$'
          ui:autofocus: true
    - title: Lifecycle
      properties:
        expirationDays:
          title: Expire objects after (days)
          type: integer
          description: Leave blank to keep objects forever.

  steps:
    - id: write-terraform
      name: Write Terraform module call
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/${{ parameters.name }}.tf
        content: |
          # Generated by Backstage template "terraform-s3" (PR-Driven IDP spike).
          # Provisioning: GitHub Actions terraform plan/apply.
          {% set product = parameters.product | parseEntityRef | pick('name') %}
          {% set bucketName = 'prometeo-sb3-' + product + '-' + parameters.name %}
          module "${{ parameters.name | replace('-', '_') }}" {
            source = "git::https://github.com/IAGAI/tf-common-modules.git//modules/s3?ref=main"

            bucket_name = "{{ bucketName }}"
          {% if parameters.expirationDays %}
            lifecycle_expiration_days = ${{ parameters.expirationDays }}
          {% endif %}

            tags = {
              product  = "{{ product }}"
              platform = "prometeo"
              managed  = "terraform-pr"
            }
          }

    - id: write-catalog-info
      name: Write the Backstage Resource entity
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/components/${{ parameters.name }}.yaml
        content: |
          {% set product = parameters.product | parseEntityRef | pick('name') %}
          {% set bucketName = 'prometeo-sb3-' + product + '-' + parameters.name %}
          apiVersion: backstage.io/v1alpha1
          kind: Resource
          metadata:
            name: ${{ parameters.name }}
            description: ${{ ('S3 bucket ' + bucketName + ' (product ' + product + ', Terraform PR)') | dump }}
            annotations:
              iag.ai/provisioning: terraform-pr
              iag.ai/terraform-path: products/${{ product }}/terraform/${{ parameters.name }}.tf
              iag.ai/s3-bucket-name: {{ bucketName | dump }}
          spec:
            type: s3-bucket
            lifecycle: experimental
            owner: guests
            system: ${{ product }}

    - id: publish
      name: Open a PR with Terraform + catalog entity
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/terraform-s3-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }}
        title: "terraform s3: ${{ parameters.product | parseEntityRef | pick('name') }}/${{ parameters.name }}"
        description: >-
          PR-Driven IDP spike. Adds
          `products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/${{ parameters.name }}.tf`
          (tf-common-modules/s3, bucket prometeo-sb3-${{ parameters.product | parseEntityRef | pick('name') }}-${{ parameters.name }})
          and its Backstage Resource entity.
          Review the terraform plan before merge — this PR is not auto-merged.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
