apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-bootstrap-product
  title: "Bootstrap product (Terraform)"
  description: >-
    One-time per product: remote state backend and AWS provider config under
    products/<product>/terraform/. Run after "Bootstrap a product" (catalog) and before
    S3 (Terraform PR) or other Terraform resource templates. Opens a PR — not auto-merged.
    Do not run twice for the same product (backend.tf already exists).
  tags:
    - prometeo
    - terraform
    - pr-driven-idp
spec:
  owner: guests
  type: service
  parameters:
    - title: Product
      required:
        - product
      properties:
        product:
          title: Product
          type: string
          description: >-
            The product to bootstrap (must already exist via "Bootstrap a product").
            Creates products/<product>/terraform/backend.tf and versions.tf.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
            defaultKind: System

  steps:
    - id: write-backend
      name: Write Terraform backend config
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/backend.tf
        content: |
          # Generated by Backstage template "terraform-bootstrap-product".
          # PoC: agents dev (sb3) state bucket. One state file per product under terraform/.
          {% set product = parameters.product | parseEntityRef | pick('name') %}
          terraform {
            backend "s3" {
              bucket       = "agents-515048895486-eu-west-1-tfstate"
              key          = "prometeo-products/{{ product }}/terraform.tfstate"
              region       = "eu-west-1"
              encrypt      = true
              use_lockfile = true
            }
          }

    - id: write-versions
      name: Write Terraform provider config
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/versions.tf
        content: |
          # Generated by Backstage template "terraform-bootstrap-product".
          terraform {
            required_version = ">= 1.9.0"

            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = ">= 5.0"
              }
            }
          }

          provider "aws" {
            region = "eu-west-1"
          }

    - id: write-readme
      name: Write Terraform README
      action: roadiehq:utils:fs:write
      input:
        path: products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/README.md
        content: |
          # Terraform (PR-Driven IDP)

          Remote state and provider config for product **${{ parameters.product | parseEntityRef | pick('name') }}**.

          ## Flow

          1. Add resources with Backstage **S3 (Terraform PR)** (or future TF templates) → PR adds `<name>.tf`
          2. `terraform-plan` GitHub Action runs on the PR
          3. Human reviews plan and merges
          4. `terraform apply` (manual or separate workflow — not enabled in spike by default)

          Crossplane manifests in `../base/` are unchanged and still deploy via ArgoCD.

    - id: publish
      name: Open a PR with Terraform bootstrap files
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
        branchName: scaffolder/terraform-bootstrap-${{ parameters.product | parseEntityRef | pick('name') }}
        title: "terraform bootstrap: ${{ parameters.product | parseEntityRef | pick('name') }}"
        description: >-
          One-time Terraform bootstrap for product
          `${{ parameters.product | parseEntityRef | pick('name') }}`.
          Adds `products/${{ parameters.product | parseEntityRef | pick('name') }}/terraform/backend.tf`,
          `versions.tf`, and `README.md`.
          Review and merge before using S3 (Terraform PR) templates.
          This PR is not auto-merged.

  output:
    links:
      - title: Open PR
        url: ${{ steps['publish'].output.remoteUrl }}
