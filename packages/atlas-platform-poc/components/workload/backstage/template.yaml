apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: workload
  title: Add a service
  description: Somewhere for a product's code to run — an identity and the network rules that let it reach what
    it needs. Create the product first.
  tags:
  - atlas
  - service
spec:
  owner: group:default/atlas-platform
  type: service
  parameters:
  - title: About the service
    required:
    - product
    - name
    properties:
      product:
        title: Product
        type: string
        description: The product this service belongs to.
        ui:field: EntityPicker
        ui:options:
          catalogFilter:
            kind: System
          defaultKind: System
        ui:autofocus: true
      name:
        title: What it is
        type: string
        description: '"Booking API", "Frontend", "Worker". Everything the platform creates for it is named after
          its lowercase form, booking-api, and that is how other services refer to it.'
        pattern: ^[A-Za-z][A-Za-z0-9 _-]{0,19}$
        maxLength: 20
  - title: Its code
    properties:
      newRepo:
        title: Create a new repository
        type: boolean
        description: Opens a pull request in iac-github for IAGAI/<product>-<service>, built from the template for
          the kind of code it holds. Untick to use a repository that already exists.
        default: true
    dependencies:
      newRepo:
        oneOf:
        - required:
          - repoType
          properties:
            newRepo:
              enum:
              - true
            repoType:
              title: What it is written in
              type: string
              description: The Python backend and Next.js templates decide the port the service listens on.
              enum:
              - Atlas-Python
              - Python
              - NextJS
              - Other
              enumNames:
              - Python backend
              - Python application
              - Next.js frontend
              - Anything else
              default: Atlas-Python
        - required:
          - repo
          properties:
            newRepo:
              enum:
              - false
            repo:
              title: Source repository
              type: string
              description: owner/name on GitHub. Recorded on the catalog entry so the service links back to its code.
              pattern: ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$
            containerPort: &containerPort
              title: Port it listens on
              type: integer
              description: The port used by the container and its Kubernetes Service.
              default: 8000
              minimum: 1
              maximum: 65535
      repoType:
        oneOf:
        - properties:
            repoType:
              enum:
              - Atlas-Python
              - NextJS
        - properties:
            repoType:
              enum:
              - Python
              - Other
            containerPort: *containerPort
  - title: Its image
    properties:
      newImage:
        title: Create a new image repository
        type: boolean
        description: Opens a pull request in cloudtools-aws-mgmt for an ECR repository its pipeline pushes to. The
          service runs no pods until its first release names an image. Untick to run an image that already exists.
        default: true
    dependencies:
      newImage:
        oneOf:
        - properties:
            newImage:
              enum:
              - true
        - required:
          - image
          properties:
            newImage:
              enum:
              - false
            image:
              title: Image to run
              type: string
              description: An existing container image, registry/repository:tag.
  - title: What it uses
    properties:
      database:
        title: Database
        type: object
        properties:
          needed:
            title: It uses a database
            type: boolean
            default: false
        dependencies:
          needed:
            oneOf:
            - properties:
                needed:
                  enum:
                  - false
            - required:
              - component
              properties:
                needed:
                  enum:
                  - true
                component:
                  title: Which one
                  type: string
                  ui:field: EntityPicker
                  ui:options:
                    catalogFilter:
                      kind: Resource
                      spec.type: database
                    defaultKind: Resource
      buckets:
        title: Buckets
        type: object
        properties:
          needed:
            title: It uses one or more buckets
            type: boolean
            default: false
        dependencies:
          needed:
            oneOf:
            - properties:
                needed:
                  enum:
                  - false
            - required:
              - components
              properties:
                needed:
                  enum:
                  - true
                components:
                  title: Which ones
                  type: array
                  items:
                    type: object
                    required:
                    - bucket
                    - level
                    properties:
                      bucket:
                        title: Bucket
                        type: string
                        ui:field: EntityPicker
                        ui:options:
                          catalogFilter:
                            kind: Resource
                            spec.type: object-store
                          defaultKind: Resource
                      level:
                        title: Access
                        type: string
                        enum:
                        - ro
                        - rw
                        enumNames:
                        - Read only
                        - Read and write
                        default: rw
                  default: []
      bedrock:
        title: It calls Bedrock
        type: boolean
        description: Invocation of the approved models through an EU inference profile. No key to handle — the service's
          own identity is what Bedrock accepts.
        default: false
  - title: Who it talks to
    description: Nothing may reach this service and it may reach nothing until it is listed here. Each entry opens
      one direction to one peer, and the peer's own manifest is updated in the same pull request so both ends agree.
    properties:
      allowFrom:
        title: Services allowed to call this one
        type: array
        description: They arrive on this service's own port.
        items:
          type: string
        ui:field: ProductServices
        default: []
      allowTo:
        title: Services this one may call
        type: array
        description: Each one is reached on the port its catalog entry records.
        items:
          type: string
        ui:field: ProductServices
        default: []
      egressDomains:
        title: Public addresses it may reach
        type: array
        description: Hostnames, reached over HTTPS. Everything else on the internet stays closed.
        items:
          type: string
        default: []
  - title: Access
    description: Leave both unticked for a service that only other services call.
    properties:
      frontend:
        title: It is the product's frontend
        type: boolean
        description: Served on https://<product name>.<env>.atlas.iag.ai behind single sign-on, which is configured
          by a pull request in apigateway. One per product.
        default: false
      externalApi:
        title: It is an external API
        type: boolean
        description: Published through API Gateway, configured by a pull request in apigateway, at
          https://tst.api.iag.ai/<env>/<family>/<product name> in dev and the sandboxes and
          /<family>/<product name> from tst on (uat.api.iag.ai in uat, api.iag.ai in production).
        default: false
    dependencies:
      externalApi:
        oneOf:
        - properties:
            externalApi:
              enum:
              - false
        - properties:
            externalApi:
              enum:
              - true
            apiPath:
              title: Path under the product's API address
              type: string
              description: Leave / unless the product already has an external API; each one takes its own path.
              pattern: ^/[A-Za-z0-9._~/-]*$
              default: /
  steps:
  - id: fetch-product
    name: Fetch current product manifests
    action: fetch:plain
    input:
      url: https://github.com/crossplane-poc/prometeo-products/tree/main/products/${{ parameters.product | parseEntityRef
        | pick('name') }}
      targetPath: products/${{ parameters.product | parseEntityRef | pick('name') }}
  - id: write-component
    name: Create component and update dependencies
    action: atlas:component:create
    input:
      kind: Workload
      product: ${{ parameters.product }}
      name: ${{ parameters.name }}
      containerPort: ${{ 3000 if (parameters.newRepo and parameters.repoType == 'NextJS') else (8000 if (parameters.newRepo
        and parameters.repoType == 'Atlas-Python') else parameters.containerPort) }}
      healthPath: ${{ '/' if (parameters.newRepo and parameters.repoType == 'NextJS') else '/health' }}
      image: ${{ '' if parameters.newImage else parameters.image }}
      bedrock: ${{ parameters.bedrock }}
      frontend: ${{ parameters.frontend }}
      api: ${{ parameters.externalApi }}
      apiPath: ${{ parameters.apiPath if parameters.externalApi else '' }}
      egressDomains: ${{ parameters.egressDomains }}
      database: ${{ parameters.database.component if (parameters.database and parameters.database.needed) else ''
        }}
      buckets: ${{ parameters.buckets.components if (parameters.buckets and parameters.buckets.needed) else [] }}
      allowFrom: ${{ parameters.allowFrom }}
      allowTo: ${{ parameters.allowTo }}
  - id: write-catalog-info
    name: Write the catalog entry
    action: roadiehq:utils:fs:write
    input:
      path: products/${{ parameters.product | parseEntityRef | pick('name') }}/catalog/${{ steps['write-component'].output.name
        }}.yaml
      content: |-
        apiVersion: backstage.io/v1alpha1
        kind: Component
        metadata:
          name: ${{ (parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name }}
          title: ${{ parameters.name | dump }}
          description: ${{ ('Service ' + parameters.name + ' of ' + (parameters.product | parseEntityRef | pick('name'))) | dump }}
          annotations:
            backstage.io/kubernetes-namespace: ${{ (parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name }}
            backstage.io/kubernetes-label-selector: 'app=${{ steps['write-component'].output.name }}'
            argocd/app-selector: atlas.iag.ai/product=${{ parameters.product | parseEntityRef | pick('name') }}
            atlas.iag.ai/repo: ${{ (('IAGAI/' + (parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name) if parameters.newRepo else parameters.repo) | dump }}
            # Read back by this same template when another service says it may call this one.
            # Without it that lookup falls back to 8000.
            atlas.iag.ai/container-port: ${{ steps['write-component'].output.containerPort | string | dump }}
        spec:
          type: service
          lifecycle: experimental
          owner: ${{ steps['write-component'].output.owner }}
          system: ${{ parameters.product | parseEntityRef | pick('name') }}
        {%- if (parameters.database and parameters.database.needed and parameters.database.component) or (parameters.buckets and parameters.buckets.needed and parameters.buckets.components | length) %}
          dependsOn:
        {%- if parameters.database and parameters.database.needed and parameters.database.component %}
            - ${{ ('resource:default/' + (parameters.database.component | parseEntityRef | pick('name'))) | dump }}
        {%- endif %}
        {%- for b in parameters.buckets.components | default([]) %}
            - ${{ ('resource:default/' + (b.bucket | parseEntityRef | pick('name'))) | dump }}
        {%- endfor %}
        {%- endif %}
  - id: write-repo-config
    name: Describe the new repository
    if: ${{ parameters.newRepo }}
    action: roadiehq:utils:fs:write
    input:
      path: iac-github/config/repos/${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}.yaml
      content: |-
        name: ${{ (parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name }}
        description: ${{ ('Service ' + parameters.name + ' of ' + (parameters.product | parseEntityRef | pick('name'))) | dump }}
        team_slug: ${{ steps['write-component'].output.owner | parseEntityRef | pick('name') }}
        type: ${{ parameters.repoType }}
        additional_teams_with_access:
          - team_slug: se-platform-lovelace
            permission: admin
        atlas_workflows_adp:
          service_name: ${{ steps['write-component'].output.name }}
          product_family: ${{ steps['write-component'].output.family }}
          product: ${{ parameters.product | parseEntityRef | pick('name') }}
  - id: fetch-ecr
    name: Fetch the registry configuration
    if: ${{ parameters.newImage }}
    action: fetch:plain:file
    input:
      url: https://github.com/crossplane-poc/cloudtools-aws-mgmt/blob/main/environments/uat/eu-west-1/ecr/ecr.auto.tfvars
      targetPath: cloudtools/environments/uat/eu-west-1/ecr/ecr.auto.tfvars
  - id: write-image-config
    name: Add the image repository
    if: ${{ parameters.newImage }}
    action: roadiehq:utils:fs:replace
    input:
      files:
      - file: cloudtools/environments/uat/eu-west-1/ecr/ecr.auto.tfvars
        matchRegex: true
        find: '\n}\s*$'
        replaceWith: "\n  ${{ (parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name
          }} = {\n    namespace    = \"${{ steps['write-component'].output.family }}\"\n    eks_families = [\"${{ steps['write-component'].output.family
          }}\"]\n    product_name = [\"${{ (parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name
          }}\"]\n    github_repo  = \"${{ ((parameters.product | parseEntityRef | pick('name')) + '-' + steps['write-component'].output.name)
          if parameters.newRepo else parameters.repo.split('/')[1] }}\"\n    team         = \"atlas\"\n  }\n}\n"
  - id: write-domain-config
    name: Describe the frontend's domain
    if: ${{ parameters.frontend }}
    action: roadiehq:utils:fs:write
    input:
      path: apigateway/config/domains/${{ steps['write-component'].output.productName }}.yaml
      content: |-
        domain: ${{ steps['write-component'].output.productName }}
        product: ${{ parameters.product | parseEntityRef | pick('name') }}
        family: ${{ steps['write-component'].output.family }}
  - id: write-api-config
    name: Describe the external API
    if: ${{ parameters.externalApi }}
    action: roadiehq:utils:fs:write
    input:
      path: apigateway/config/apis/${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}.yaml
      content: |-
        product: ${{ parameters.product | parseEntityRef | pick('name') }}
        product_name: ${{ steps['write-component'].output.productName }}
        family: ${{ steps['write-component'].output.family }}
        service: ${{ steps['write-component'].output.name }}
        path: ${{ parameters.apiPath | default('/') | dump }}
  - id: publish
    name: Open a pull request
    action: publish:github:pull-request
    input:
      repoUrl: github.com?repo=prometeo-products&owner=crossplane-poc
      sourcePath: products
      targetPath: products
      branchName: scaffolder/workload-${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}
      title: 'atlas service: ${{ parameters.product | parseEntityRef | pick(''name'') }}/${{ steps[''write-component''].output.name
        }}'
      description: |-
        Adds the `${{ steps['write-component'].output.name }}` service to `${{ parameters.product | parseEntityRef | pick('name') }}`.

        It also updates every component it was pointed at — each database and bucket grants it access, and each service it talks to gets the matching rule — because access is recorded at both ends. Check the whole diff.
  - id: publish-repo
    name: Open the repository pull request
    if: ${{ parameters.newRepo }}
    action: publish:github:pull-request
    input:
      repoUrl: github.com?repo=iac-github&owner=crossplane-poc
      sourcePath: iac-github
      branchName: scaffolder/repo-${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}
      title: 'NOJIRA: Add repository ${{ parameters.product | parseEntityRef | pick(''name'') }}-${{ steps[''write-component''].output.name
        }} for ADP service ${{ parameters.product | parseEntityRef | pick(''name'') }}/${{ steps[''write-component''].output.name
        }}'
      description: |-
        Creates the repository for the `${{ steps['write-component'].output.name }}` service of `${{ parameters.product | parseEntityRef | pick('name') }}`, opened by the Atlas Developer Platform.
  - id: publish-image
    name: Open the image repository pull request
    if: ${{ parameters.newImage }}
    action: publish:github:pull-request
    input:
      repoUrl: github.com?repo=cloudtools-aws-mgmt&owner=crossplane-poc
      sourcePath: cloudtools
      branchName: scaffolder/ecr-${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}
      title: 'NOJIRA: Add ECR repository ${{ steps[''write-component''].output.family }}/${{ parameters.product | parseEntityRef
        | pick(''name'') }}-${{ steps[''write-component''].output.name }} for ADP'
      description: |-
        Creates the image repository for the `${{ steps['write-component'].output.name }}` service of `${{ parameters.product | parseEntityRef | pick('name') }}`, opened by the Atlas Developer Platform.
  - id: publish-access
    name: Open the access pull request
    if: ${{ parameters.frontend or parameters.externalApi }}
    action: publish:github:pull-request
    input:
      repoUrl: github.com?repo=apigateway-aws-mgmt&owner=crossplane-poc
      sourcePath: apigateway
      branchName: scaffolder/access-${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}
      title: 'NOJIRA: Publish ${{ steps[''write-component''].output.productName }} ${{ steps[''write-component''].output.name
        }} for ADP'
      description: |-
        {%- if parameters.frontend %}
        Single sign-on for the `${{ steps['write-component'].output.productName }}` frontend domain.
        {%- endif %}
        {%- if parameters.externalApi %}
        API Gateway access to the `${{ steps['write-component'].output.name }}` service of `${{ parameters.product | parseEntityRef | pick('name') }}`, on `${{ parameters.apiPath | default('/') }}` under `/${{ steps['write-component'].output.family }}/${{ steps['write-component'].output.productName }}`.
        {%- endif %}

        Opened by the Atlas Developer Platform.
  output:
    links:
    - title: Open the pull request
      url: ${{ steps['publish'].output.remoteUrl }}
    - title: Open the repository pull request
      if: ${{ parameters.newRepo }}
      url: ${{ steps['publish-repo'].output.remoteUrl }}
    - title: Open the image repository pull request
      if: ${{ parameters.newImage }}
      url: ${{ steps['publish-image'].output.remoteUrl }}
    - title: Open the access pull request
      if: ${{ parameters.frontend or parameters.externalApi }}
      url: ${{ steps['publish-access'].output.remoteUrl }}
    text:
    - title: Service address
      content: ${{ steps['write-component'].output.name }}.${{ parameters.product | parseEntityRef | pick('name') }}-${{ steps['write-component'].output.name
        }}.svc.cluster.local:${{ steps['write-component'].output.containerPort }}
