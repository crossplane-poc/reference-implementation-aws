# The blast radius of the prd rung.
#
# One AppProject per environment, each with exactly one destination. An Application generated by
# the ApplicationSet for prd cannot be retargeted at another cluster -- if someone edits the
# generator or a manifest to point elsewhere, ArgoCD refuses the sync rather than doing it. That
# is the containment: a mistake in the prd pipeline stays in prd.
#
# The resource whitelists are narrow on purpose. Products only ever create a Namespace and a few
# platform.prometeo.iag.ai composite resources; everything the components actually build --
# Workspaces, ConfigMaps, IAM, buckets -- is created by Crossplane as composed resources, under
# the provider's own credentials, not by ArgoCD. So ArgoCD needs no permission to write them,
# and does not get it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prometeo-prd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Products deployed to the prd rung, from crossplane-poc/prometeo-products
    products/*/rendered/prd. Populated by the prometeo-products-prd ApplicationSet.

  sourceRepos:
    - 'https://github.com/crossplane-poc/prometeo-products.git'

  destinations:
    # By cluster name, matching the ArgoCD cluster Secret, so no endpoint URL is written down
    # here and rotating one does not mean editing this file.
    - name: ims-prd-eu-west-1
      namespace: '*'

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: platform.prometeo.iag.ai
      kind: '*'

  # Production only. Sync windows are advisory in ArgoCD -- they block automated sync, and a
  # human with permission can always override one -- so this is a speed bump against an
  # absent-minded Friday sync, not an authorisation control. The control is the GitHub
  # Environment on the promotion workflow plus CODEOWNERS on products/*/envs/prd/.
  syncWindows:
    - kind: deny
      schedule: '0 17 * * 5'
      duration: 63h
      applications:
        - '*'
      manualSync: true
