# The blast radius of the dev rung.
#
# One AppProject per environment, each with exactly one destination. An Application generated by
# the ApplicationSet for dev cannot be retargeted at another cluster -- if someone edits the
# generator or a manifest to point elsewhere, ArgoCD refuses the sync rather than doing it. That
# is the containment: a mistake in the dev pipeline stays in dev.
#
# The resource whitelists are narrow on purpose. Products only ever create a Namespace and a few
# platform.prometeo.iag.ai composite resources; everything the components actually build --
# Workspaces, ConfigMaps, IAM, buckets -- is created by Crossplane as composed resources, under
# the provider's own credentials, not by ArgoCD. So ArgoCD needs no permission to write them,
# and does not get it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prometeo-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: >-
    Products deployed to the dev rung, from crossplane-poc/prometeo-products
    products/*/rendered/dev. Populated by the prometeo-products ApplicationSet.

  sourceRepos:
    - 'https://github.com/crossplane-poc/prometeo-products.git'

  destinations:
    # By cluster name, matching the ArgoCD cluster Secret, so no endpoint URL is written down
    # here and rotating one does not mean editing this file.
    - name: ims-eu-west-1
      namespace: '*'

  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  namespaceResourceWhitelist:
    - group: platform.prometeo.iag.ai
      kind: '*'
