# One Application per (product, environment), for every environment except prd.
#
# prd is deliberately not here -- it has its own ApplicationSet, its own AppProject and no
# automated sync, in applicationset-prometeo-products-prd.yaml. Splitting them means the
# production deployment policy is a file you can read on its own rather than a conditional
# buried in a template, and it survives the day prd moves to a second ArgoCD instance.
#
# How a product lands on the right cluster:
#
#   git directories   products/*/rendered/*        ->  products/add/rendered/tst
#                                                          |       |          |
#                     matrix feeds the basename ("tst") into the cluster generator's selector
#                                                                             |
#   clusters          prometeo.iag.ai/rung: tst    ->  the tst spoke's cluster Secret
#
# So the environment a directory is named after is the environment it deploys to, and there is
# nowhere to write that mapping down wrongly. A rung with no registered cluster generates no
# Application at all rather than deploying somewhere unintended.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometeo-products
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/crossplane-poc/prometeo-products.git
              revision: main
              directories:
                - path: products/*/rendered/*
                - path: products/*/rendered/prd
                  exclude: true
          - clusters:
              selector:
                matchLabels:
                  prometeo.iag.ai/rung: '{{ .path.basename }}'
  template:
    metadata:
      name: 'prometeo-{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        prometeo.iag.ai/product: '{{ index .path.segments 1 }}'
        prometeo.iag.ai/rung: '{{ .path.basename }}'
    spec:
      project: 'prometeo-{{ .path.basename }}'
      source:
        repoURL: https://github.com/crossplane-poc/prometeo-products.git
        targetRevision: main
        # Plain manifests, rendered by tools/render.py in that repo and committed. No Kustomize
        # and no Helm here on purpose: what a promotion pull request shows is exactly what gets
        # applied, with nothing evaluated between review and apply.
        path: '{{ .path.path }}'
        directory:
          recurse: false
      destination:
        name: '{{ .name }}'
      syncPolicy:
        # dev, tst and uat deploy themselves once a promotion is merged. The gate on these rungs
        # is the pull request, not the sync -- a second manual step here would just be a button
        # nobody reads. prd is the opposite, and lives in the other file.
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - ServerSideApply=true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
