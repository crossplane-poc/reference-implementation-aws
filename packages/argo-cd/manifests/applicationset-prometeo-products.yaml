apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prometeo-products
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/crossplane-poc/prometeo-products.git
        revision: main
        directories:
          - path: products/*/base
  template:
    metadata:
      name: 'prometeo-{{path[1]}}-sb3'
    spec:
      project: prometeo-products
      source:
        repoURL: https://github.com/crossplane-poc/prometeo-products.git
        targetRevision: main
        path: '{{path}}'
        # Plain manifests, not Kustomize — each component template drops a self-contained
        # Namespace+XR file here with no shared resources: list to keep in sync, on purpose (see
        # commit message). ArgoCD applies every yaml file in the directory directly.
        directory:
          recurse: false
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        # No `automated:` block, on purpose — merging a product's PR must not deploy it. Sync is
        # a manual, deliberate action (ArgoCD UI/CLI or Backstage's ArgoCD plugin), not a side
        # effect of a merge.
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
