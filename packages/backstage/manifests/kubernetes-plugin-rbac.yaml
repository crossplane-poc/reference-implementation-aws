# Backstage's Kubernetes plugin queries the cluster as its own pod ServiceAccount
# (packages/backstage/manifests/k8s-config-secret.yaml's authProvider: serviceAccount), which had
# no RBAC bound anywhere — every entity's Kubernetes tab 403'd on every resource type
# (pods/services/configmaps/deployments/... ), for every entity, not just newly scaffolded ones.
# The built-in `view` ClusterRole covers exactly the resource types the plugin requests.
# Cluster-wide (not per-namespace) because scaffolded products create new namespaces on demand.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backstage-kubernetes-plugin-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
