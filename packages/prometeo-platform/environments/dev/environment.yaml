#
# THE `dev` RUNG OF THE LADDER. One of these exists per cluster, and it is the only file that
# knows anything about where it is: account, VPC, subnets, domains, Cognito. Every composition
# reads it, so a component manifest in prometeo-products can carry no environment at all and
# still produce a correctly-named bucket in whichever account it is applied to. That is what
# makes promotion a file copy rather than a rewrite.
#
# `environment: sb3`, not `dev`, on purpose. The ladder rung is dev; the AWS environment name is
# still sb3, because that is what the account is called and what every resource here is already
# named after. The two converge when a real dev account exists. The rung is not recorded in this
# file at all -- it is the `prometeo.iag.ai/rung` label on the ArgoCD cluster Secret, which is
# what the ApplicationSet matches on.
#
# Re-run the generator after any change to the cluster's VPC, subnets or OIDC provider, and
# commit the diff. The values below the "platform conventions" line are hand-maintained --
# re-apply them if you regenerate.
